<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a rig</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-md top">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <h1 class="name"><span id="shopGhost" aria-hidden="true"></span><span id="shopName"></span></h1>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutDlg">About us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<p class="tagline" id="tagline"></p>

<div class="info">
  <span class="status" id="badge"></span>
  <button class="ghost-btn" id="nextBtn" type="button">Next available slot</button>
  <span class="hint" id="nextMsg"></span>
</div>

<main class="layout">
  <section class="rigs" id="rigs" aria-label="Rigs"></section>
  <aside class="games">
    <h2>Games on every rig</h2>
    <ul id="gameList"></ul>
  </aside>
</main>

<footer id="footer"></footer>

<div class="modal fade" id="bookDlg" tabindex="-1" aria-labelledby="bookTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-4" id="bookTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="slots" id="slots"></div>
        <p class="summary" id="summary"></p>
        <form id="bookForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="fName">Name</label>
            <input class="form-control" id="fName" type="text" autocomplete="name">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="fPhone">Phone</label>
            <input class="form-control" id="fPhone" type="tel" autocomplete="tel">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="fEmail">Email</label>
            <input class="form-control" id="fEmail" type="email" autocomplete="email">
            <div class="invalid-feedback"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="ghost-btn go" id="goBtn" type="submit" form="bookForm" disabled>Confirm booking</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="aboutDlg" tabindex="-1" aria-labelledby="aboutTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-4" id="aboutTitle">About us</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="aboutText"></p>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
  <div class="toast text-bg-success" id="bookToast" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastText"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<div class="player">
  <div class="mp" id="mp">
    <p class="track" id="track">Loading song</p>
    <div class="mp-ctrl">
      <button type="button" id="playBtn">Play</button>
    </div>
    <input type="range" id="vol" min="0" max="100" aria-label="Volume">
  </div>
  <button class="disc" id="disc" type="button" aria-label="Music player"></button>
</div>

<script src="bootstrap/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
